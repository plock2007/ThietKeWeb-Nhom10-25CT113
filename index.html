<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lời chào</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1e3a8a, #0ea5e9);
      font-family: Arial, sans-serif;
    }

    .welcome {
      color: #ffffff;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      text-align: center;
      white-space: pre-line;
      line-height: 1.4;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      animation: fadeInUp 1s ease-out, glow 2s ease-in-out infinite alternate;
    }

    .credit {
      margin-top: 12px;
      color: #e2e8f0;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      text-align: center;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.3s forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      }
      to {
        text-shadow: 0 0 22px rgba(255, 255, 255, 0.9);
      }
    }
  </style>
</head>
<body>
  <div>
    <h1 class="welcome">Xin chào mọi người
đến với trang web của chúng em!</h1>
    <p class="credit">Thực hiện bởi nhóm 10 - Lớp 25CT113</p>
  </div>
</body>
</html>
